{% extends "base.html" %} {% load static %} {% block title %}My Profile -
Stationery Hub{% endblock %} {% block content %}
<style>
  .profile-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 1.5rem;
    row-gap: 1.25rem;
    padding-inline: 1rem;
  }

  .profile-field {
    min-width: 0;
  }

  .profile-field label {
    display: block;
    margin-bottom: 0.5rem;
    color: #4b5563;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .profile-control {
    box-sizing: border-box;
    display: block;
    width: 100%;
    min-height: 2.75rem;
    border: 1px solid #d1d5db;
    border-radius: 0.5rem;
    background: #fff;
    padding: 0.65rem 0.8rem;
    color: #111827;
    font-size: 0.875rem;
    transition:
      border-color 0.15s ease,
      box-shadow 0.15s ease,
      background-color 0.15s ease;
  }

  .profile-control:hover {
    border-color: #9ca3af;
  }

  .profile-control:focus {
    border-color: #b45309;
    outline: none;
    box-shadow: 0 0 0 3px rgb(180 83 9 / 15%);
  }

  .profile-control:disabled {
    border-color: #e5e7eb;
    background: #f9fafb;
    color: #6b7280;
  }

  .profile-field--address-details {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr);
    gap: 1.25rem;
  }

  #email-verification-status {
    position: relative;
    overflow: visible;
  }

  #email-verification-status::after {
    position: absolute;
    z-index: 20;
    bottom: calc(100% + 0.5rem);
    left: 50%;
    width: max-content;
    padding: 0.375rem 0.625rem;
    border-radius: 0.375rem;
    background: #111827;
    color: #fff;
    content: attr(data-tooltip);
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.25rem;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 0.25rem);
    transition:
      opacity 0.15s ease,
      transform 0.15s ease;
    visibility: hidden;
  }

  #email-verification-status:hover::after,
  #email-verification-status:focus-visible::after {
    opacity: 1;
    transform: translate(-50%, 0);
    visibility: visible;
  }

  #email-verification-status:focus-visible {
    outline: 2px solid #92400e;
    outline-offset: 3px;
  }

  .profile-save {
    grid-column: 1 / -1;
    justify-self: center;
    width: min(100%, 20rem);
    margin-block: 0.75rem;
  }

  @media (max-width: 767px) {
    .profile-form {
      grid-template-columns: minmax(0, 1fr);
      row-gap: 1.25rem;
    }

    .profile-field--address-details,
    .profile-save {
      grid-column: auto;
    }

    .profile-field--address-details {
      grid-template-columns: minmax(0, 1fr);
      gap: 1.25rem;
    }
  }
</style>

<div
  class="bg-[#f5ede0] px-4 py-12"
  style="min-height: calc(100vh - 4rem); margin-bottom: -3rem"
>
  <div class="w-full max-w-4xl mx-auto bg-white rounded-lg shadow-md p-5 md:p-7">
    <div class="mb-6 px-4">
      <p class="text-xs tracking-widest text-gray-500 uppercase mb-2">
        Your account
      </p>
      <h1 class="text-4xl font-serif">My Profile</h1>
      <p class="text-sm text-gray-500 mt-2">
        Save your contact and delivery details for a faster checkout.
      </p>
    </div>

    <div id="message-box" class="hidden mb-4 text-sm rounded px-4 py-2"></div>

    <form id="profile-form" class="profile-form">
      <div class="profile-field">
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-2"
          >Username</label
        >
        <input
          type="text"
          id="username"
          class="profile-control"
        />
      </div>

      <div class="profile-field">
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-2"
          >Full Name</label
        >
        <input
          type="text"
          id="full_name"
          autocomplete="name"
          class="profile-control"
          placeholder="Your full name"
        />
      </div>

      <div class="profile-field">
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-2"
          >Email Address</label
        >
        <div class="flex max-w-[24rem] items-center gap-2">
          <input
            type="email"
            id="email"
            disabled
            class="profile-control min-w-0 flex-1"
          />
          <button
            type="button"
            id="email-verification-status"
            class="hidden h-7 w-7 flex-shrink-0 items-center justify-center rounded-full"
            aria-label="Email verification status"
          >
            <svg
              id="email-verified-icon"
              class="hidden h-5 w-5"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path d="m5 10.5 3.25 3.25L15.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <svg
              id="email-unverified-icon"
              class="hidden h-5 w-5"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.7" />
              <path d="M10 6.5v4.25m0 2.75h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <div class="profile-field">
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-2"
          >Phone Number</label
        >
        <input
          type="text"
          id="phone_number"
          autocomplete="tel"
          class="profile-control"
          placeholder="98XXXXXXXX"
        />
      </div>

      <div class="profile-field profile-field--address-details">
        <div class="profile-field">
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            autocomplete="address-level2"
            class="profile-control"
            placeholder="City"
          />
        </div>
        <div class="profile-field">
          <label for="address">Street Address</label>
          <input
            type="text"
            id="address"
            autocomplete="street-address"
            class="profile-control"
            placeholder="Street address"
          />
        </div>
        <div class="profile-field">
          <label for="postal_code">Postal Code</label>
          <input
            type="text"
            id="postal_code"
            autocomplete="postal-code"
            class="profile-control"
            placeholder="Postal code"
          />
        </div>
      </div>

      <button
        type="submit"
        class="profile-save bg-gray-900 text-white py-2.5 rounded font-semibold hover:bg-gray-800 transition"
      >
        Save Changes
      </button>
    </form>
  </div>
</div>

<script>
  const token = localStorage.getItem("access_token");
  const msgBox = document.getElementById("message-box");
  const profileSaveButton = document.querySelector(
    '#profile-form button[type="submit"]',
  );

  if (!token) {
    window.location.href = "{% url 'login-page' %}";
  }

  async function loadProfile() {
    const response = await fetch("{% url 'profile' %}", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!response.ok) {
      window.location.href = "{% url 'login-page' %}";
      return;
    }
    const data = await response.json();
    document.getElementById("username").value = data.username;
    document.getElementById("email").value = data.email;
    const verificationStatus = document.getElementById(
      "email-verification-status",
    );
    if (data.is_email_verified) {
      verificationStatus.className =
        "inline-flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-700 ring-1 ring-inset ring-emerald-600/20";
      verificationStatus.dataset.tooltip = "Verified";
      verificationStatus.setAttribute("aria-label", "Email verified");
      document
        .getElementById("email-verified-icon")
        .classList.remove("hidden");
    } else {
      verificationStatus.className =
        "inline-flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-700 ring-1 ring-inset ring-amber-600/20";
      verificationStatus.dataset.tooltip = "Not verified";
      verificationStatus.setAttribute("aria-label", "Email not verified");
      document
        .getElementById("email-unverified-icon")
        .classList.remove("hidden");
    }
    document.getElementById("full_name").value =
      [data.first_name, data.last_name].filter(Boolean).join(" ");
    document.getElementById("phone_number").value = data.phone_number || "";
    document.getElementById("address").value = data.address || "";
    document.getElementById("city").value = data.city || "";
    document.getElementById("postal_code").value = data.postal_code || "";
  }

  document
    .getElementById("profile-form")
    .addEventListener("submit", async function (e) {
      e.preventDefault();
      if (profileSaveButton.disabled) return;

      profileSaveButton.disabled = true;
      profileSaveButton.setAttribute("aria-busy", "true");
      msgBox.classList.add("hidden");

      try {
        const nameParts = document
          .getElementById("full_name")
          .value.trim()
          .split(/\s+/)
          .filter(Boolean);

        const response = await fetch("{% url 'profile' %}", {
          method: "PATCH",
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            first_name: nameParts[0] || "",
            last_name: nameParts.slice(1).join(" "),
            phone_number: document.getElementById("phone_number").value,
            address: document.getElementById("address").value,
            city: document.getElementById("city").value,
            postal_code: document.getElementById("postal_code").value,
          }),
        });

        if (response.ok) {
          msgBox.textContent = "Profile updated successfully.";
          msgBox.className =
            "mb-4 text-sm rounded px-4 py-2 bg-green-50 text-green-700 border border-green-200";
        } else {
          msgBox.textContent =
            "Could not update profile. Please check your details.";
          msgBox.className =
            "mb-4 text-sm rounded px-4 py-2 bg-red-50 text-red-700 border border-red-200";
        }
      } catch (error) {
        console.error("Profile update failed:", error);
        msgBox.textContent =
          "Unable to update your profile. Please check your connection and try again.";
        msgBox.className =
          "mb-4 text-sm rounded px-4 py-2 bg-red-50 text-red-700 border border-red-200";
      } finally {
        profileSaveButton.disabled = false;
        profileSaveButton.removeAttribute("aria-busy");
      }
      msgBox.classList.remove("hidden");
    });

  loadProfile();
</script>
{% endblock %}
