{% extends "base.html" %} {% load static %} {% block title %}My Profile -
Stationery Hub{% endblock %} {% block content %}
<div
  class="min-h-[80vh] flex flex-col items-center justify-center bg-[#f5ede0] px-4 py-12"
>
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
    <p class="text-xs tracking-widest text-gray-500 uppercase mb-2">
      Your account
    </p>
    <h1 class="text-4xl font-serif mb-8">My Profile</h1>

    <div id="message-box" class="hidden mb-4 text-sm rounded px-4 py-2"></div>

    <form id="profile-form" class="space-y-5">
      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Username</label
        >
        <input
          type="text"
          id="username"
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
        />
      </div>

      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Email Address</label
        >
        <input
          type="email"
          id="email"
          disabled
          class="w-full border border-gray-200 bg-gray-100 text-gray-500 rounded px-4 py-3"
        />
      </div>

      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Phone Number</label
        >
        <input
          type="text"
          id="phone_number"
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
          placeholder="98XXXXXXXX"
        />
      </div>

      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Role</label
        >
        <input
          type="text"
          id="role"
          disabled
          class="w-full border border-gray-200 bg-gray-100 text-gray-500 rounded px-4 py-3"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-gray-900 text-white py-3 rounded font-semibold hover:bg-gray-800 transition"
      >
        Save Changes
      </button>
    </form>
  </div>
</div>

<script>
  const token = localStorage.getItem("access_token");
  const msgBox = document.getElementById("message-box");

  if (!token) {
    window.location.href = "{% url 'login-page' %}";
  }

  async function loadProfile() {
    const response = await fetch("/api/users/profile/", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!response.ok) {
      window.location.href = "{% url 'login-page' %}";
      return;
    }
    const data = await response.json();
    document.getElementById("username").value = data.username;
    document.getElementById("email").value = data.email;
    document.getElementById("phone_number").value = data.phone_number || "";
    document.getElementById("role").value = data.role;
  }

  document
    .getElementById("profile-form")
    .addEventListener("submit", async function (e) {
      e.preventDefault();
      msgBox.classList.add("hidden");

      const response = await fetch("/api/users/profile/", {
        method: "PATCH",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          phone_number: document.getElementById("phone_number").value,
        }),
      });

      if (response.ok) {
        msgBox.textContent = "Profile updated successfully.";
        msgBox.className =
          "mb-4 text-sm rounded px-4 py-2 bg-green-50 text-green-700 border border-green-200";
      } else {
        msgBox.textContent =
          "Could not update profile. Please check your details.";
        msgBox.className =
          "mb-4 text-sm rounded px-4 py-2 bg-red-50 text-red-700 border border-red-200";
      }
      msgBox.classList.remove("hidden");
    });

  loadProfile();
</script>
{% endblock %}
