{% extends "base.html" %} {% load static %} {% block title %}Sign In -
Stationery Hub{% endblock %} {% block content %}
<div
  class="min-h-[80vh] flex flex-col items-center justify-center bg-[#f5ede0] px-4 py-12"
>
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
    <p class="text-xs tracking-widest text-gray-500 uppercase mb-2">Welcome</p>
    <h1 class="text-4xl font-serif mb-8">Sign In</h1>

    <div
      id="error-message"
      class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded px-4 py-2"
    ></div>

    <form id="login-form" class="space-y-5">
      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Email Address</label
        >
        <input
          type="email"
          id="email"
          required
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Password</label
        >
        <div class="relative">
          <input
            type="password"
            id="password"
            required
            class="w-full border border-gray-300 rounded px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-amber-600"
            placeholder="••••••••"
          />
          <button
            type="button"
            id="toggle-password"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 text-sm"
          >
            Show
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-600">
          <input type="checkbox" class="rounded" />
          Remember me
        </label>
        <a
          href="{% url 'forgot-password' %}"
          class="text-amber-700 hover:underline"
          >Forgot password?</a
        >
      </div>

      <button
        type="submit"
        class="w-full bg-gray-900 text-white py-3 rounded font-semibold hover:bg-gray-800 transition"
      >
        Sign In
      </button>
    </form>

    <div class="flex items-center gap-4 my-6">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-sm text-gray-400">or</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <button
      id="admin-sign-in"
      type="button"
      class="w-full border border-amber-700 text-amber-700 py-3 rounded font-semibold hover:bg-amber-50 transition"
    >
      Sign in as Admin
    </button>
    <p
      id="admin-sign-in-help"
      class="hidden text-sm text-center text-gray-500 mt-3"
    >
      This uses the email and password above. Your account must already have
      Admin access.
    </p>

    <p class="text-center text-sm text-gray-600 mt-6">
      Don't have an account?
      <a
        href="{% url 'register-page' %}"
        class="text-amber-700 font-semibold hover:underline"
        >Create one</a
      >
    </p>

  </div>
</div>

<script>
  const adminSignInButton = document.getElementById("admin-sign-in");
  const adminSignInHelp = document.getElementById("admin-sign-in-help");
  const loginForm = document.getElementById("login-form");
  const loginParams = new URLSearchParams(window.location.search);
  let adminOnly = loginParams.get("admin_only") === "1";

  function signInAsAdmin() {
    adminOnly = true;
    adminSignInHelp.classList.remove("hidden");
    loginForm.requestSubmit();
  }

  adminSignInButton.addEventListener("click", signInAsAdmin);
  if (adminOnly) {
    adminSignInHelp.classList.remove("hidden");
  }

  document
    .getElementById("toggle-password")
    .addEventListener("click", function () {
      const passwordInput = document.getElementById("password");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        this.textContent = "Hide";
      } else {
        passwordInput.type = "password";
        this.textContent = "Show";
      }
    });

  document
    .getElementById("login-form")
    .addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("error-message");
      errorBox.classList.add("hidden");

      try {
        const response = await fetch("{% url 'login' %}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, admin_only: adminOnly }),
        });
        const data = await response.json();

        if (response.ok) {
          localStorage.setItem("access_token", data.access);
          localStorage.setItem("refresh_token", data.refresh);
          const next = adminOnly
            ? "{% url 'dashboard' %}"
            : loginParams.get("next");
          const destination = next
            ? new URL(next, window.location.origin)
            : new URL("/", window.location.origin);
          window.stationeryNavigate(
            destination.origin === window.location.origin
              ? destination.href
              : "/",
            { reload: adminOnly },
          );
        } else {
          errorBox.textContent = data.detail || "Invalid email or password.";
          errorBox.classList.remove("hidden");
        }
      } catch (err) {
        errorBox.textContent = "Something went wrong. Please try again.";
        errorBox.classList.remove("hidden");
      }
    });
</script>
{% endblock %}
