{% extends "base.html" %} {% load static %} {% block title %}Create Account -
Stationery Hub{% endblock %} {% block content %}
<div
  class="min-h-[80vh] flex flex-col items-center justify-center bg-[#f5ede0] px-4 py-12"
>
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
    <p class="text-xs tracking-widest text-gray-500 uppercase mb-2">Join us</p>
    <h1 class="text-4xl font-serif mb-8">Create Account</h1>

    <div
      id="error-message"
      class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded px-4 py-2"
    ></div>

    <form id="register-form" class="space-y-5">
      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Username</label
        >
        <input
          type="text"
          id="username"
          required
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
          placeholder="yourname"
        />
      </div>

      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Email Address</label
        >
        <input
          type="email"
          id="email"
          required
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Phone Number</label
        >
        <input
          type="text"
          id="phone_number"
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
          placeholder="98XXXXXXXX"
        />
      </div>

      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Password</label
        >
        <input
          type="password"
          id="password"
          required
          minlength="8"
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-gray-900 text-white py-3 rounded font-semibold hover:bg-gray-800 transition"
      >
        Create Account
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a
        href="{% url 'login-page' %}"
        class="text-amber-700 font-semibold hover:underline"
        >Sign In</a
      >
    </p>
  </div>
</div>

<script>
  document
    .getElementById("register-form")
    .addEventListener("submit", async function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const phone_number = document.getElementById("phone_number").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("error-message");
      errorBox.classList.add("hidden");

      try {
        const response = await fetch("/api/users/register/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            email,
            phone_number,
            password,
            role: "customer",
          }),
        });
        const data = await response.json();

        if (response.ok) {
          window.location.href = "{% url 'login-page' %}";
        } else {
          const firstError = Object.values(data)[0];
          errorBox.textContent = Array.isArray(firstError)
            ? firstError[0]
            : "Registration failed. Please check your details.";
          errorBox.classList.remove("hidden");
        }
      } catch (err) {
        errorBox.textContent = "Something went wrong. Please try again.";
        errorBox.classList.remove("hidden");
      }
    });
</script>
{% endblock %}
