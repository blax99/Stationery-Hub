{% extends "base.html" %} {% load static %} {% block title %}Forgot Password -
Stationery Hub{% endblock %} {% block content %}
<style>
  body {
    background-color: #f5ede0;
  }
</style>

<div
  class="min-h-[80vh] flex flex-col items-center justify-center bg-[#f5ede0] px-4 py-12"
>
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
    <p class="text-xs tracking-widest text-gray-500 uppercase mb-2">
      Reset your password
    </p>
    <h1 class="text-4xl font-serif mb-6">Forgot Password</h1>

    <p class="text-sm text-gray-600 mb-6">
      Enter your email and we'll send you a link to reset your password.
    </p>

    <div id="message-box" class="hidden mb-4 text-sm rounded px-4 py-2"></div>

    <form id="forgot-form" class="space-y-5">
      <div>
        <label class="block text-xs tracking-wider text-gray-600 uppercase mb-1"
          >Email Address</label
        >
        <input
          type="email"
          id="email"
          required
          class="w-full border border-gray-300 rounded px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"
          placeholder="you@example.com"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-gray-900 text-white py-3 rounded font-semibold hover:bg-gray-800 transition disabled:cursor-wait disabled:opacity-70"
      >
        Send Reset Link
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Remembered your password?
      <a
        href="{% url 'login-page' %}"
        class="text-amber-700 font-semibold hover:underline"
        >Sign In</a
      >
    </p>
  </div>
</div>

<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + "=") {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
  const csrftoken = getCookie("csrftoken");

  document
    .getElementById("forgot-form")
    .addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const msgBox = document.getElementById("message-box");
      const submitButton = this.querySelector('button[type="submit"]');
      if (submitButton.disabled) return;

      submitButton.disabled = true;
      submitButton.setAttribute("aria-busy", "true");
      submitButton.textContent = "Sending...";
      msgBox.classList.add("hidden");

      try {
        const response = await fetch("{% url 'password-reset' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
          },
          body: JSON.stringify({ email }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(
            data.detail || "Unable to send a reset link. Please try again.",
          );
        }

        msgBox.textContent =
          "If this email exists, a reset link has been sent.";
        msgBox.className =
          "mb-4 text-sm rounded px-4 py-2 bg-green-50 text-green-700 border border-green-200";
        msgBox.classList.remove("hidden");
      } catch (err) {
        msgBox.textContent =
          err.message || "Something went wrong. Please try again.";
        msgBox.className =
          "mb-4 text-sm rounded px-4 py-2 bg-red-50 text-red-700 border border-red-200";
        msgBox.classList.remove("hidden");
      } finally {
        submitButton.disabled = false;
        submitButton.removeAttribute("aria-busy");
        submitButton.textContent = "Send Reset Link";
      }
    });
</script>
{% endblock %}
