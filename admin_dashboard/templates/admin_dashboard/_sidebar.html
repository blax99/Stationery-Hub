<style>
  button:not(:disabled),
  input[type="button"]:not(:disabled),
  input[type="submit"]:not(:disabled),
  input[type="reset"]:not(:disabled) {
    cursor: pointer;
  }

  @keyframes stationery-admin-button-spin {
    to {
      transform: rotate(360deg);
    }
  }

  button[aria-busy="true"]::before {
    content: "";
    display: inline-block;
    width: 0.9rem;
    height: 0.9rem;
    margin-right: 0.5rem;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    vertical-align: -0.1em;
    animation: stationery-admin-button-spin 0.7s linear infinite;
  }
</style>

<aside class="sticky top-0 z-20 flex h-auto w-full shrink-0 flex-col self-start bg-gray-900 p-4 text-white shadow-lg md:sticky md:h-screen md:w-64 md:p-6">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold md:mb-8 md:text-2xl">Stationery Hub</h1>
    <button
      id="adminSidebarToggle"
      type="button"
      class="rounded-lg p-2 text-white hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-white md:hidden"
      aria-controls="adminSidebarContent"
      aria-expanded="false"
      aria-label="Open admin navigation"
    >
      <svg data-menu-icon="open" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg data-menu-icon="close" class="hidden h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div id="adminSidebarContent" class="hidden flex-col md:flex md:flex-1">
    <nav class="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-3 md:mt-0 md:flex md:flex-col md:space-y-2" aria-label="Admin dashboard">
      <a
        href="{% url 'dashboard' %}"
        class="block rounded-lg px-3 py-2 text-sm transition md:px-4 md:py-3 md:text-base {% if active_page == 'dashboard' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}"
        {% if active_page == 'dashboard' %}aria-current="page"{% endif %}
      >
        📊 Dashboard
      </a>
      <a
        href="{% url 'products' %}"
        class="block rounded-lg px-3 py-2 text-sm transition md:px-4 md:py-3 md:text-base {% if active_page == 'products' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}"
        {% if active_page == 'products' %}aria-current="page"{% endif %}
      >
        📦 Products
      </a>
      <a
        href="{% url 'inventory' %}"
        class="block rounded-lg px-3 py-2 text-sm transition md:px-4 md:py-3 md:text-base {% if active_page == 'inventory' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}"
        {% if active_page == 'inventory' %}aria-current="page"{% endif %}
      >
        📋 Inventory
      </a>
      <a
        href="{% url 'orders' %}"
        class="block rounded-lg px-3 py-2 text-sm transition md:px-4 md:py-3 md:text-base {% if active_page == 'orders' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}"
        {% if active_page == 'orders' %}aria-current="page"{% endif %}
      >
        🛒 Orders
      </a>
      <a
        href="{% url 'analytics' %}"
        class="block rounded-lg px-3 py-2 text-sm transition md:px-4 md:py-3 md:text-base {% if active_page == 'analytics' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}"
        {% if active_page == 'analytics' %}aria-current="page"{% endif %}
      >
        📈 Analytics
      </a>
      <a
        href="{% url 'users' %}"
        class="block rounded-lg px-3 py-2 text-sm transition md:px-4 md:py-3 md:text-base {% if active_page == 'users' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}"
        {% if active_page == 'users' %}aria-current="page"{% endif %}
      >
        👥 Users
      </a>
    </nav>

    <div class="mt-4 grid grid-cols-2 gap-3 border-t border-gray-700 pt-4 md:mt-auto md:flex md:flex-col md:space-y-3 md:pt-6">
      <a
        href="{% url 'home' %}"
        class="block rounded-lg px-3 py-2 text-center text-sm font-medium text-gray-200 transition hover:bg-gray-800 hover:text-white md:px-4 md:py-3 md:text-base"
      >
        View website
      </a>
      <form id="adminLogoutCsrfForm" class="hidden">{% csrf_token %}</form>
      <button
        id="adminLogoutButton"
        type="button"
        data-logout-url="{% url 'logout' %}"
        class="w-full rounded-lg bg-red-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-red-700 disabled:cursor-wait disabled:opacity-70 md:px-4 md:py-3 md:text-base"
      >
        Sign out
      </button>
    </div>
  </div>
</aside>
<div
  id="adminConfirmationModal"
  class="fixed inset-0 z-[100] hidden items-center justify-center bg-gray-950/60 p-4 backdrop-blur-sm"
  role="presentation"
>
  <section
    class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="adminConfirmationTitle"
    aria-describedby="adminConfirmationMessage"
  >
    <div class="mb-5 flex items-start gap-4">
      <div
        id="adminConfirmationIcon"
        class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-700"
        aria-hidden="true"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 4h.01M10.3 3.9 1.8 18.6A1.6 1.6 0 0 0 3.2 21h17.6a1.6 1.6 0 0 0 1.4-2.4L13.7 3.9a2 2 0 0 0-3.4 0Z" />
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <h2 id="adminConfirmationTitle" class="text-lg font-semibold text-gray-900">
          Confirm action
        </h2>
        <p id="adminConfirmationMessage" class="mt-1 text-sm leading-6 text-gray-600"></p>
        <label id="adminConfirmationInputLabel" for="adminConfirmationInput" class="mt-4 hidden text-sm font-medium text-gray-700"></label>
        <input
          id="adminConfirmationInput"
          class="mt-2 hidden w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-100"
          type="text"
        />
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <button
        id="adminConfirmationCancel"
        type="button"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
      >Cancel</button>
      <button
        id="adminConfirmationAccept"
        type="button"
        class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-gray-800"
      >Continue</button>
    </div>
  </section>
</div>
<script>
  (() => {
    const modal = document.getElementById("adminConfirmationModal");
    const title = document.getElementById("adminConfirmationTitle");
    const message = document.getElementById("adminConfirmationMessage");
    const inputLabel = document.getElementById("adminConfirmationInputLabel");
    const input = document.getElementById("adminConfirmationInput");
    const cancelButton = document.getElementById("adminConfirmationCancel");
    const acceptButton = document.getElementById("adminConfirmationAccept");
    const icon = document.getElementById("adminConfirmationIcon");
    let settleDialog;

    function closeDialog(result) {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      if (settleDialog) {
        settleDialog(result);
        settleDialog = null;
      }
    }

    window.showAdminConfirmation = ({
      title: dialogTitle = "Confirm action",
      message: dialogMessage,
      confirmLabel = "Continue",
      cancelLabel = "Cancel",
      danger = false,
      inputLabel: dialogInputLabel = "",
      inputValue = "",
      showCancel = true,
    }) =>
      new Promise((resolve) => {
        title.textContent = dialogTitle;
        message.textContent = dialogMessage || "";
        acceptButton.textContent = confirmLabel;
        cancelButton.textContent = cancelLabel;
        cancelButton.classList.toggle("hidden", !showCancel);
        acceptButton.className = danger
          ? "rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700"
          : "rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-gray-800";
        icon.className = danger
          ? "flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full bg-red-100 text-red-700"
          : "flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-700";
        inputLabel.textContent = dialogInputLabel;
        inputLabel.classList.toggle("hidden", !dialogInputLabel);
        input.classList.toggle("hidden", !dialogInputLabel);
        input.value = inputValue;
        settleDialog = resolve;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        window.requestAnimationFrame(() => {
          (dialogInputLabel ? input : showCancel ? cancelButton : acceptButton).focus();
        });
      });

    cancelButton.addEventListener("click", () => closeDialog(null));
    acceptButton.addEventListener("click", () =>
      closeDialog({ confirmed: true, value: input.value }),
    );
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeDialog(null);
    });
    document.addEventListener("keydown", (event) => {
      if (modal.classList.contains("hidden")) return;
      if (event.key === "Escape") closeDialog(null);
      if (event.key === "Enter" && event.target === input) {
        event.preventDefault();
        acceptButton.click();
      }
    });

    document.addEventListener(
      "submit",
      (event) => {
        if (event.defaultPrevented || !(event.target instanceof HTMLFormElement)) {
          return;
        }
        const form = event.target;
        if (form.dataset.confirmApproved === "true") {
          delete form.dataset.confirmApproved;
          return;
        }

        let config = form.dataset.confirmMessage
          ? {
              title: form.dataset.confirmTitle,
              message: form.dataset.confirmMessage,
              confirmLabel: form.dataset.confirmLabel,
              danger: form.dataset.confirmDanger === "true",
            }
          : null;
        if (form.id === "userForm" && document.getElementById("formAction").value === "edit") {
          config = {
            title: "Update user details?",
            message: "Save these changes to the user account?",
            confirmLabel: "Save changes",
          };
        } else if (form.id === "productForm" && document.getElementById("productId").value) {
          config = {
            title: "Update product?",
            message: "Save these changes to this product?",
            confirmLabel: "Update product",
          };
        }
        if (!config) return;

        event.preventDefault();
        const submitter = event.submitter;
        window.showAdminConfirmation(config).then((result) => {
          if (!result?.confirmed) return;
          form.dataset.confirmApproved = "true";
          if (submitter && !submitter.disabled) {
            form.requestSubmit(submitter);
          } else {
            form.requestSubmit();
          }
        });
      },
      true,
    );
  })();

  const adminSidebarToggle = document.querySelector("#adminSidebarToggle");
  const adminSidebarContent = document.querySelector("#adminSidebarContent");

  adminSidebarToggle?.addEventListener("click", () => {
    const isExpanded = adminSidebarToggle.getAttribute("aria-expanded") === "true";
    const willExpand = !isExpanded;
    adminSidebarToggle.setAttribute("aria-expanded", String(willExpand));
    adminSidebarToggle.setAttribute(
      "aria-label",
      willExpand ? "Close admin navigation" : "Open admin navigation",
    );
    adminSidebarContent?.classList.toggle("hidden", !willExpand);
    adminSidebarToggle
      .querySelector('[data-menu-icon="open"]')
      ?.classList.toggle("hidden", willExpand);
    adminSidebarToggle
      .querySelector('[data-menu-icon="close"]')
      ?.classList.toggle("hidden", !willExpand);
  });

  const pendingNotification = sessionStorage.getItem("stationery-notification");
  if (pendingNotification) {
    sessionStorage.removeItem("stationery-notification");
    const notification = document.createElement("div");
    notification.setAttribute("role", "status");
    notification.setAttribute("aria-live", "polite");
    notification.style.cssText = [
      "position: fixed",
      "top: 1rem",
      "right: 1rem",
      "z-index: 10000",
      "width: max-content",
      "max-width: min(24rem, calc(100vw - 2rem))",
      "border: 1px solid #15803d",
      "border-radius: 0.5rem",
      "background: #15803d",
      "padding: 1rem 1.25rem",
      "color: #fff",
      "font-size: 0.875rem",
      "font-weight: 500",
      "box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)",
    ].join(";");
    notification.textContent = pendingNotification;
    document.body.appendChild(notification);
    window.setTimeout(() => notification.remove(), 6000);
  }

  document.querySelector("#adminLogoutButton")?.addEventListener("click", async (event) => {
    const button = event.currentTarget;
    if (button.disabled) return;
    const originalLabel = button.textContent;
    const csrfToken = document.querySelector(
      "#adminLogoutCsrfForm input[name=csrfmiddlewaretoken]",
    )?.value;

    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    button.textContent = "Signing out...";

    try {
      const response = await fetch(button.dataset.logoutUrl, {
        method: "POST",
        headers: csrfToken ? { "X-CSRFToken": csrfToken } : {},
      });

      if (!response.ok) {
        throw new Error(`Sign out failed with HTTP ${response.status}.`);
      }

      localStorage.removeItem("access_token");
      localStorage.removeItem("refresh_token");
      sessionStorage.setItem(
        "stationery-notification",
        "Admin logout successful.",
      );
      window.location.assign("/");
    } catch (error) {
      console.error("Unable to sign out.", error);
      window.showAdminConfirmation({
        title: "Unable to sign out",
        message: `${error.message} Please try again.`,
        confirmLabel: "Close",
        showCancel: false,
      });
      button.disabled = false;
      button.textContent = originalLabel;
      button.removeAttribute("aria-busy");
    }
  });
</script>
<script>
  document.addEventListener("submit", (event) => {
    if (event.defaultPrevented) return;

    const submitter = event.submitter;
    if (!(submitter instanceof HTMLButtonElement)) return;

    submitter.disabled = true;
    submitter.setAttribute("aria-busy", "true");
  });
</script>
