<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Stationery Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white p-6">

        <h1 class="text-2xl font-bold mb-8">
            Stationery Hub
        </h1>

        <nav class="space-y-3">

            <a href="/dashboard/"
               class="block px-4 py-3 rounded-lg hover:bg-gray-800">
                📊 Dashboard
            </a>

            <a href="/dashboard/products/"
               class="block px-4 py-3 rounded-lg hover:bg-gray-800">
                📦 Products
            </a>

            <a href="/dashboard/inventory/"
               class="block px-4 py-3 rounded-lg bg-gray-800">
                📦 Inventory
            </a>

            <a href="/dashboard/orders/"
               class="block px-4 py-3 rounded-lg hover:bg-gray-800">
                📋 Orders
            </a>

            <a href="/dashboard/analytics/"
               class="block px-4 py-3 rounded-lg hover:bg-gray-800">
                📈 Analytics
            </a>

        </nav>

    </aside>


    <!-- Main Content -->
    <main class="flex-1 p-8">

        <!-- Header -->
        <div class="mb-8">

            <h2 class="text-3xl font-bold text-gray-800">
                Inventory
            </h2>

            <p class="text-gray-500 mt-1">
                Monitor and manage product stock
            </p>

        </div>


        <!-- Inventory Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

            <!-- Total Products -->
            <div class="bg-white p-6 rounded-xl shadow">

                <p class="text-gray-500">
                    Total Products
                </p>

                <h3 class="text-3xl font-bold mt-2">
                    0
                </h3>

            </div>


            <!-- Low Stock -->
            <div class="bg-white p-6 rounded-xl shadow">

                <p class="text-gray-500">
                    Low Stock
                </p>

                <h3 class="text-3xl font-bold mt-2">
                    0
                </h3>

            </div>


            <!-- Out of Stock -->
            <div class="bg-white p-6 rounded-xl shadow">

                <p class="text-gray-500">
                    Out of Stock
                </p>

                <h3 class="text-3xl font-bold mt-2">
                    0
                </h3>

            </div>

        </div>


        <!-- Search and Filter -->
        <div class="bg-white p-5 rounded-xl shadow mb-6">

            <div class="flex gap-4">

                <input
                    type="text"
                    placeholder="Search products..."
                    class="flex-1 border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">

                <select class="border rounded-lg px-4 py-3">

                    <option>All Stock Status</option>
                    <option>In Stock</option>
                    <option>Low Stock</option>
                    <option>Out of Stock</option>

                </select>

                <button
                    class="bg-gray-800 text-white px-6 py-3 rounded-lg">
                    Search
                </button>

            </div>

        </div>


        <!-- Inventory Table -->
        <div class="bg-white rounded-xl shadow overflow-hidden">

            <div class="p-5 border-b">

                <h3 class="text-xl font-semibold">
                    Stock Overview
                </h3>

            </div>

            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-gray-50">

                        <tr>
                            <th class="px-6 py-4">Product</th>
                            <th class="px-6 py-4">Category</th>
                            <th class="px-6 py-4">Stock</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Action</th>
                        </tr>

                    </thead>

                    <tbody>

                        <!-- Temporary Example -->

                        <tr class="border-t">

                            <td class="px-6 py-4">
                                Blue Ball Pen
                            </td>

                            <td class="px-6 py-4">
                                Pens
                            </td>

                            <td class="px-6 py-4">
                                120
                            </td>

                            <td class="px-6 py-4">

                                <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
                                    In Stock
                                </span>

                            </td>

                            <td class="px-6 py-4">

                                <button class="text-blue-600 hover:underline">
                                    Update Stock
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>
</html>
