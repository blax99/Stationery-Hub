<!-- Floating chat button -->
<button id="chat-toggle"
    style="position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:#7c5cfc;color:white;border:none;font-size:1.5rem;cursor:pointer;z-index:9999;box-shadow:0 4px 12px rgba(124,92,252,0.4);">
    💬
</button>

<!-- Chat box (hidden by default) -->
<div id="chat-box"
    style="display:none;position:fixed;bottom:80px;right:20px;width:320px;height:420px;background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:9999;flex-direction:column;overflow:hidden;">

    <!-- Header -->
    <div style="background:#7c5cfc;color:white;padding:12px 16px;font-weight:600;font-size:14px;">
        StationeryHub Support
    </div>

    <!-- Messages area -->
    <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px;background:#f9fafb;">
        <p style="margin:4px 0;color:#333;font-size:13px;">Hi! 👋 How can I help you today?</p>
    </div>

    <!-- Input area -->
    <div style="display:flex;padding:10px;border-top:1px solid #e2e8f0;background:white;">
        <input id="chat-input" type="text" placeholder="Type your message..."
            style="flex:1;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;outline:none;font-size:13px;">
        <button id="chat-send"
            style="margin-left:8px;padding:8px 14px;background:#7c5cfc;color:white;border:none;border-radius:8px;cursor:pointer;font-size:13px;">
            Send
        </button>
    </div>
</div>
