<nav class="bg-white shadow-md px-4 sm:px-6 py-4">
  <div class="max-w-7xl mx-auto">
    <!-- Main Navbar -->
    <div class="flex items-center justify-between gap-3">
      <!-- Logo -->
      <div
        class="text-xl sm:text-2xl font-bold text-gray-800 whitespace-nowrap"
      >
        StationeryHub<span class="text-blue-600">.</span>
      </div>

      <!-- Desktop Nav Links -->
      <ul class="hidden md:flex items-center gap-8 text-gray-700 font-medium">
        <li>
          <a href="{% url 'home' %}" class="hover:text-blue-600 transition">Home</a>
        </li>
        <li>
          <a href="{% url 'products:product_list' %}" class="hover:text-blue-600 transition">Products</a>
        </li>
        <!-- Categories Dropdown Menu -->
        <li class="relative group py-2">
          <a href="{% url 'products:category_list' %}" class="hover:text-blue-600 transition flex items-center gap-1">
            Categories
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </a>

          <!-- Dropdown Box (Appears on Hover) -->
          <div class="absolute left-0 top-full hidden group-hover:block w-48 bg-white border border-gray-200 rounded-lg shadow-lg py-2 z-50">
            {% for category in nav_categories %}
              <a 
                href="{% url 'products:product_list_by_category' category.slug %}" 
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-blue-600 transition"
              >
                {{ category.name }}
              </a>
            {% empty %}
              <span class="block px-4 py-2 text-xs text-gray-400">No categories found</span>
            {% endfor %}
          </div>
        </li>
      </ul>

      <!-- Right Section -->
      <div class="flex items-center gap-3 sm:gap-5">
        <!-- Search -->
        <div class="hidden relative sm:block w-8 h-8">
          <!-- Search Icon -->
          <button
            id="searchButton"
            type="button"
            class="absolute inset-0 flex items-center justify-center text-gray-700 hover:text-blue-600 transition cursor-pointer"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>

          <!-- Search Box -->
          <div
            id="searchBox"
            class="hidden absolute right-0 top-1/2 -translate-y-1/2 z-50"
          >
            <input
              type="text"
              id="searchInput"
              placeholder="Search..."
              class="sm:w-[4vw] md:w-[12vw] lg:w-[22vw] h-9 text-sm px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <!-- Wishlist -->
        <button
          class="text-gray-700 hover:text-red-500 transition cursor-pointer"
        >
          <i class="fa-regular fa-heart"></i>
        </button>

        <!-- Cart -->
        <button
          class="relative text-gray-700 hover:text-blue-600 transition cursor-pointer"
        >
          <i class="fa-solid fa-cart-shopping"></i>

          <span
            class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs rounded-full h-4 w-4 flex items-center justify-center"
          >
            2
          </span>
        </button>

        <div id="userMenu" class="relative hidden sm:block">
          <a
            id="authLink"
            href="{% url 'login-page' %}"
            data-profile-url="{% url 'profile' %}"
            data-profile-page="{% url 'profile-page' %}"
            data-login-page="{% url 'login-page' %}"
            class="border border-black bg-white text-black px-3 sm:px-4 py-1.5 rounded-lg hover:bg-black hover:text-white transition text-sm font-medium cursor-pointer text-center"
          >
            Sign In
          </a>
          <div
            id="userDropdown"
            class="hidden group-hover:block group-focus-within:block absolute right-0 top-full w-44 bg-white border border-gray-200 rounded-lg shadow-lg py-2 z-50"
          >
            <a
              href="{% url 'profile-page' %}"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-blue-600 transition"
              >My Profile</a
            >
            <a
              href="/orders/"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-blue-600 transition"
              >Orders</a
            >
            <button
              id="logoutButton"
              type="button"
              class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-red-600 transition"
            >
              Logout
            </button>
          </div>
        </div>
        <!-- Mobile Hamburger -->
        <button
          id="menuButton"
          type="button"
          class="md:hidden text-gray-700 text-xl ml-1"
          aria-label="Toggle menu"
        >
          <i id="menuIcon" class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation ONLY -->
    <div id="mobileMenu" class="hidden md:hidden mt-4 border-t pt-4">
      <ul class="flex flex-col gap-4 text-gray-700 font-medium">
        <li>
          <a href="{% url 'home' %}" class="block hover:text-blue-600 transition"> Home </a>
        </li>

        <li>
          <a href="{% url 'products:product_list' %}" class="block hover:text-blue-600 transition">
            Products
          </a>
        </li>

        <li>
          <a href="{% url 'products:category_list' %}" class="block hover:text-blue-600 transition">
            Categories
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
