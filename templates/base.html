{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Stationery Hub{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="https://img.icons8.com/clouds/100/stationery.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <!-- Your Compiled CSS -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <script src="{% static 'js/turbo.js' %}" defer></script>
  </head>

  <body class="min-h-screen bg-gray-50 flex flex-col">
    {% include "navbar.html" %}

    <main class="grow">{% block content %} {% endblock %}</main>

    {% include "footer.html" %}

    <script src="{% static 'js/main.js' %}?v=5"></script>
    <script src="{% static 'js/navbar.js' %}?v=8"></script>
  </body>
</html>
