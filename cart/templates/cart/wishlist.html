
{% extends "base.html" %}

{% block title %}
Wishlist
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-6 py-10">

    <div class="flex items-center justify-between mb-10">
        <div>
            <h1 class="text-3xl font-normal">
                My Wishlist
            </h1>

            <p  id = "wishlist-subtitle" class="text-sm text-gray-500 mt-2">
                0 saved items
            </p>
        </div>

        <span id="wishlist-count" class="text-sm text-gray-500">
            0 items
        </span>
    </div>


    <!-- Wishlist Items -->
    <section
        id="wishlist-items"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
    >
        <p class="col-span-full text-center text-gray-500 py-20">
            Loading wishlist...
        </p>
    </section>


    <!-- Empty Wishlist -->
    <div id="empty-wishlist" class="text-center py-20 hidden">

        <div class="text-5xl mb-5">
            ♡
        </div>

        <h2 class="text-2xl font-normal">
            Your wishlist is empty
        </h2>

        <p class="text-gray-500 mt-3">
            Save products you love and find them here later.
        </p>

        <a
            href="{% url 'products:product_list' %}"
            class="inline-block bg-slate-800 text-white px-6 py-3 mt-6 text-sm hover:bg-slate-700 transition"
        >
            Continue Shopping
        </a>

    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const token = localStorage.getItem("access_token");

    const wishlistItems =
        document.getElementById("wishlist-items");

    const emptyWishlist =
        document.getElementById("empty-wishlist");

    const wishlistCount =
        document.getElementById("wishlist-count");


    /*
    ========================================
    UPDATE WISHLIST COUNT
    ========================================
    */

    function updateWishlistCount(count) {

    wishlistCount.textContent =
        count + (count === 1 ? " item" : " items");

    const wishlistSubtitle =
        document.getElementById("wishlist-subtitle");

    if (wishlistSubtitle) {

        wishlistSubtitle.textContent =
            count +
            (count === 1
                ? " saved item"
                : " saved items");
    }
}


    /*
    ========================================
    SHOW EMPTY WISHLIST
    ========================================
    */

    function showEmptyWishlist() {
        emptyWishlist.classList.remove("hidden");
    }


    /*
    ========================================
    HIDE EMPTY WISHLIST
    ========================================
    */

    function hideEmptyWishlist() {
        emptyWishlist.classList.add("hidden");
    }


    /*
    ========================================
    LOAD WISHLIST
    ========================================
    */

    function loadWishlist() {

        fetch("/wishlist/", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        })

        .then(function (response) {

            if (!response.ok) {
                throw new Error(
                    "Failed to load wishlist"
                );
            }

            return response.json();
        })

        .then(function (data) {

            wishlistItems.innerHTML = "";

            updateWishlistCount(data.items.length);

            const wishlistNavCount =
                document.getElementById("wishlist-nav-count");

            if(wishlistNavCount) {
                wishlistNavCount.textContent = data.items.length;
            }



            if (data.items.length === 0) {
                showEmptyWishlist();
                return;
            }

            hideEmptyWishlist();

            data.items.forEach(function (item) {
                createWishlistCard(item);
            });

            setupRemoveButtons();
            setupAddToCartButtons();

        })

        .catch(function (error) {

            console.error(
                "Wishlist error:",
                error
            );

            wishlistItems.innerHTML = `
                <p class="col-span-full text-center text-red-500 py-20">
                    Failed to load wishlist.
                </p>
            `;
        });
    }


    /*
    ========================================
    CREATE WISHLIST CARD
    ========================================
    */

    function createWishlistCard(item) {

        const card =
            document.createElement("div");

        card.className =
            "wishlist-card border border-gray-200 bg-white relative";


        const imageHTML = item.image
            ?
            `
            <div class="w-full h-48 flex items-center justify-center overflow-hidden mb-4">
                <img
                    src="${item.image}"
                    alt="${item.product}"
                    class="w-full h-full object-contain transition-transform duration-300 ease-in-out hover:scale-105"
                >
            </div>
            `
            :
            `
                <div
                    class="w-full h-48 bg-gray-100 flex items-center justify-center text-gray-400 mb-4"
                >
                    No Image
                </div>
            `;


        const categoryHTML = item.category
            ?
            `
                <p class="text-sm text-gray-500 mt-1">
                    ${item.category}
                </p>
            `
            :
            "";


        card.innerHTML = `

            <div class="p-4">

                ${imageHTML}

                <h3 class="text-lg font-normal">
                    ${item.product}
                </h3>

                ${categoryHTML}

                <p class="text-lg mt-3">
                    Rs. ${item.price}
                </p>

                <div class="mt-5">

                    <button
                        type="button"
                        class="add-to-cart w-full bg-slate-800 text-white py-2 text-sm hover:bg-slate-700 transition"
                        data-product-id="${item.product_id}"
                    >
                        Move to Cart
                    </button>

                </div>

            </div>


            <!-- Remove Wishlist -->

            <button
    type="button"
    class="remove-wishlist absolute top-3 right-3
           w-8 h-8 rounded-full
           flex items-center justify-center
           bg-gray-100 text-gray-500
           hover:bg-red-50 hover:text-red-600
           transition duration-200
           text-lg font-medium"
    data-item-id="${item.id}"
    title="Remove from wishlist"
>
    ×
</button>
        `;


        wishlistItems.appendChild(card);
    }


    /*
    ========================================
    REMOVE FROM WISHLIST
    ========================================
    */

    function setupRemoveButtons() {

        document
            .querySelectorAll(".remove-wishlist")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const itemId =
                            this.dataset.itemId;


                        fetch("/wishlist/", {
                            method: "DELETE",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token
                            },

                            body: JSON.stringify({
                                item_id: itemId
                            })
                        })

                        .then(function (response) {

                            if (!response.ok) {
                                throw new Error(
                                    "Failed to remove wishlist item"
                                );
                            }

                            return response.json();
                        })

                        .then(function (data) {

                            console.log(
                                "Wishlist:",
                                data
                            );


                            button
                                .closest(".wishlist-card")
                                .remove();


                            const remainingItems =
                                document.querySelectorAll(
                                    ".remove-wishlist"
                                ).length;


                            updateWishlistCount(
                                remainingItems
                            );

                            const wishlistNavCount =
                                document.getElementById("wishlist-nav-count");

                            if (wishlistNavCount) {
                                wishlistNavCount.textContent =
                                    remainingItems;
                            }


                            if (remainingItems === 0) {
                                showEmptyWishlist();
                            }

                        })

                        .catch(function (error) {

                            console.error(
                                "Remove wishlist error:",
                                error
                            );

                        });
                    }
                );
            });
    }


    /*
    ========================================
    ADD TO CART
    ========================================
    */

    function setupAddToCartButtons() {

    document
        .querySelectorAll(".add-to-cart")
        .forEach(function (button) {

            button.addEventListener(
                "click",
                async function () {

                    const productId =
                        this.dataset.productId;

                    const wishlistCard =
                        this.closest(".wishlist-card");

                    const removeButton =
                        wishlistCard.querySelector(
                            ".remove-wishlist"
                        );

                    const wishlistItemId =
                        removeButton.dataset.itemId;

                    try {

                        /* =========================
                           ADD PRODUCT TO CART
                        ========================= */

                        const cartResponse =
                            await fetch(
                                "/cart/items/",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token
                                    },

                                    body: JSON.stringify({
                                        product_id:
                                            productId,

                                        quantity: 1
                                    })
                                }
                            );

                        const cartData =
                            await cartResponse.json();

                        console.log(
                            "Cart:",
                            cartData
                        );

                        if (!cartResponse.ok) {
                            throw new Error(
                                cartData.error ||
                                "Failed to add product to cart"
                            );
                        }


                        /* =========================
                           REMOVE FROM WISHLIST
                        ========================= */

                        const wishlistResponse =
                            await fetch(
                                "/wishlist/",
                                {
                                    method: "DELETE",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token
                                    },

                                    body: JSON.stringify({
                                        item_id:
                                            wishlistItemId
                                    })
                                }
                            );

                        const wishlistData =
                            await wishlistResponse.json();

                        console.log(
                            "Wishlist:",
                            wishlistData
                        );

                        if (!wishlistResponse.ok) {
                            throw new Error(
                                wishlistData.error ||
                                "Failed to remove product from wishlist"
                            );
                        }


                        /* =========================
                           REMOVE CARD FROM PAGE
                        ========================= */

                        wishlistCard.remove();


                        /* =========================
                           UPDATE WISHLIST COUNT
                        ========================= */

                        const remainingItems =
                            document.querySelectorAll(
                                ".remove-wishlist"
                            ).length;

                        updateWishlistCount(
                            remainingItems
                        );


                        /* =========================
                           UPDATE NAVBAR COUNT
                        ========================= */

                        const wishlistNavCount =
                            document.getElementById(
                                "wishlist-nav-count"
                            );

                        if (wishlistNavCount) {

                            wishlistNavCount.textContent =
                                remainingItems;
                        }


                        /* =========================
                           EMPTY WISHLIST
                        ========================= */

                        if (remainingItems === 0) {

                            showEmptyWishlist();
                        }


                        /* =========================
                           UPDATE CART COUNT
                        ========================= */

                        if (
                            typeof updateCartCount ===
                            "function"
                        ) {

                            updateCartCount();
                        }

                    }

                    catch (error) {

                        console.error(
                            "Move to cart error:",
                            error
                        );

                    }

                }
            );

        });

}

    /*
    ========================================
    CHECK LOGIN
    ========================================
    */

    if (!token) {

        wishlistItems.innerHTML = "";

        updateWishlistCount(0);

        showEmptyWishlist();

        return;
    }


    /*
    ========================================
    START
    ========================================
    */

    loadWishlist();

});
</script>

{% endblock %}
