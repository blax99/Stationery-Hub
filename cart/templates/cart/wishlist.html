{% extends "base.html" %}

{% block title %}
Wishlist
{% endblock %}

{% block content %}

<div class="max-w-7xl mx-auto px-6 py-10">

    <div class="flex items-center justify-between mb-10">

        <div>
            <h1 class="text-3xl font-normal">
                My Wishlist
            </h1>

            <p class="text-sm text-gray-500 mt-2">
                Products you've saved for later
            </p>
        </div>

        <span id="wishlist-count" class="text-sm text-gray-500">
            0 items
        </span>

    </div>


    <section
        id="wishlist-items"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
    >
    </section>


    <div id="empty-wishlist" class="text-center py-20 hidden">

        <div class="text-5xl mb-5">
            ♡
        </div>

        <h2 class="text-2xl font-normal">
            Your wishlist is empty
        </h2>

        <p class="text-gray-500 mt-3">
            Save products you love and find them here later.
        </p>

        <a
            href="{% url 'products:product_list' %}"
            class="inline-block bg-slate-800 text-white px-6 py-3 mt-6 text-sm hover:bg-slate-700 transition"
        >
            Continue Shopping
        </a>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const token = localStorage.getItem("access_token");

    const wishlistItems = document.getElementById("wishlist-items");
    const emptyWishlist = document.getElementById("empty-wishlist");
    const wishlistCount = document.getElementById("wishlist-count");


    if (!token) {

        emptyWishlist.classList.remove("hidden");

        return;
    }


    // Load Wishlist
    fetch("/api/wishlist/", {
        method: "GET",
        headers: {
            "Authorization": "Bearer " + token
        }
    })

    .then(function (response) {

        if (!response.ok) {
            throw new Error("Failed to load wishlist");
        }

        return response.json();
    })

    .then(function (data) {

        wishlistItems.innerHTML = "";

        wishlistCount.textContent =
            data.items.length + " items";


        if (data.items.length === 0) {

            emptyWishlist.classList.remove("hidden");

            return;
        }


        emptyWishlist.classList.add("hidden");


        data.items.forEach(function (item) {

            const card = document.createElement("div");

            card.className =
                "wishlist-card border border-gray-200 bg-white";


            card.innerHTML = `

                <div class="relative h-72 bg-gray-100">

                    ${
                        item.image
                        ? `
                            <img
                                src="${item.image}"
                                alt="${item.product}"
                                class="w-full h-full object-contain"
                            >
                          `
                        : ""
                    }


                    <button
                        type="button"
                        class="remove-wishlist absolute top-4 right-4 w-9 h-9 bg-white border border-gray-200 flex items-center justify-center text-xl hover:bg-gray-50"
                        data-item-id="${item.id}"
                    >
                        ×
                    </button>

                </div>


                <div class="p-5">

                    <p class="text-xs tracking-[0.15em] text-gray-500">
                        ${item.category || ""}
                    </p>

                    <h2 class="text-lg font-medium mt-2">
                        ${item.product}
                    </h2>

                    <p class="text-lg mt-3">
                        Rs. ${Number(item.price).toFixed(2)}
                    </p>


                    <button
                        type="button"
                        class="add-to-cart block w-full bg-slate-800 text-white py-3 mt-5 text-sm text-center hover:bg-slate-700 transition"
                        data-product-id="${item.product_id}"
                    >
                        Add to Cart
                    </button>

                </div>

            `;


            wishlistItems.appendChild(card);

        });


        // Remove from Wishlist
        document.querySelectorAll(".remove-wishlist").forEach(function (button) {

            button.addEventListener("click", function () {

                const itemId = this.dataset.itemId;


                fetch("/api/wishlist/", {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        item_id: itemId
                    })
                })

                .then(function (response) {

                    if (!response.ok) {
                        throw new Error("Failed to remove wishlist item");
                    }

                    return response.json();
                })

                .then(function (data) {

                    console.log("Wishlist:", data);


                    button.closest(".wishlist-card").remove();


                    const remainingItems =
                        document.querySelectorAll(".remove-wishlist").length;

                    wishlistCount.textContent =
                        remainingItems + " items";


                    if (remainingItems === 0) {

                        emptyWishlist.classList.remove("hidden");

                    }

                })

                .catch(function (error) {

                    console.error(
                        "Remove wishlist error:",
                        error
                    );

                });

            });

        });


        // Add to Cart
        document.querySelectorAll(".add-to-cart").forEach(function (button) {

            button.addEventListener("click", function () {

                const productId = this.dataset.productId;


                fetch("/api/cart/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        product_id: productId,
                        quantity: 1
                    })
                })

                .then(function (response) {

                    if (!response.ok) {
                        throw new Error("Failed to add product to cart");
                    }

                    return response.json();
                })

                .then(function (data) {

                    console.log("Cart:", data);

                    button.textContent = "Added to Cart";

                    button.classList.remove(
                        "bg-slate-800",
                        "hover:bg-slate-700"
                    );

                    button.classList.add(
                        "bg-green-700"
                    );

                })

                .catch(function (error) {

                    console.error(
                        "Add to cart error:",
                        error
                    );

                });

            });

        });

    })

    .catch(function (error) {

        console.error(
            "Wishlist error:",
            error
        );

    });

});

</script>

{% endblock %}
