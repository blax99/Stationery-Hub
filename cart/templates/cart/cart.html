{% extends "base.html" %}

{% block title %}
Shopping Cart
{% endblock %}

{% block content %}

<div class="max-w-7xl mx-auto px-6 py-10">

    <div class="mb-10">

        <h1 class="text-3xl font-normal">
            Shopping Cart
        </h1>

        <p class="text-sm text-gray-500 mt-2">
            Review your selected products
        </p>

    </div>


    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

        <!-- CART ITEMS -->

        <div class="lg:col-span-2">

            <div
                id="api-cart-items"
                class="space-y-5"
            >

                <p class="text-gray-500">
                    Loading cart...
                </p>

            </div>

        </div>


        <!-- ORDER SUMMARY -->

        <div>

            <div class="border border-gray-200 bg-white p-6">

                <h2 class="text-xl font-medium mb-6">
                    Order Summary
                </h2>


                <div class="flex justify-between text-sm mb-4">

                    <span class="text-gray-500">
                        Subtotal
                    </span>

                    <span id="subtotal">
                        Rs. 0
                    </span>

                </div>


                <div class="flex justify-between text-sm mb-4">

                    <span class="text-gray-500">
                        Shipping
                    </span>

                    <span>
                        Free
                    </span>

                </div>


                <div class="border-t border-gray-200 pt-4">

                    <div class="flex justify-between text-lg font-medium">

                        <span>
                            Total
                        </span>

                        <span id="total">
                            Rs. 0
                        </span>

                    </div>

                </div>


                <button
                    type="button"
                    class="w-full bg-slate-800 text-white py-3 mt-6 text-sm hover:bg-slate-700"
                >
                    Proceed to Checkout
                </button>

            </div>

        </div>

    </div>

</div>


<script>

function getAccessToken() {

    return localStorage.getItem("access_token");

}


async function refreshAccessToken() {

    const refreshToken =
        localStorage.getItem("refresh_token");


    if (!refreshToken) {

        return null;

    }


    const response = await fetch(
        "/api/users/login/refresh/",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                refresh: refreshToken
            })
        }
    );


    if (!response.ok) {

        return null;

    }


    const data =
        await response.json();


    localStorage.setItem(
        "access_token",
        data.access
    );


    return data.access;

}


async function cartRequest(
    url,
    options = {}
) {

    let token =
        getAccessToken();


    options.headers = {

        ...(options.headers || {}),

        "Authorization":
            "Bearer " + token

    };


    let response =
        await fetch(
            url,
            options
        );


    if (response.status === 401) {

        token =
            await refreshAccessToken();


        if (!token) {

            return response;

        }


        options.headers = {

            ...(options.headers || {}),

            "Authorization":
                "Bearer " + token

        };


        response =
            await fetch(
                url,
                options
            );

    }


    return response;

}


async function loadCart() {

    const container =
        document.getElementById(
            "api-cart-items"
        );


    try {

        const response =
            await cartRequest(
                "/api/cart/"
            );


        console.log(
            "Cart API status:",
            response.status
        );


        const data =
            await response.json();


        console.log(
            "Cart data:",
            data
        );


        if (!response.ok) {

            container.innerHTML = `

                <p class="text-red-500">
                    Unable to load cart.
                </p>

            `;

            return;

        }


        container.innerHTML = "";


        if (data.items.length === 0) {

            container.innerHTML = `

                <div class="text-center py-20">

                    <div class="text-5xl mb-5">
                        🛒
                    </div>

                    <h2 class="text-2xl font-normal">
                        Your cart is empty
                    </h2>

                    <p class="text-gray-500 mt-3">
                        Add some products to your cart.
                    </p>

                </div>

            `;


            document.getElementById(
                "subtotal"
            ).textContent = "Rs. 0";


            document.getElementById(
                "total"
            ).textContent = "Rs. 0";


            return;

        }


        const items = [...data.items].sort((a, b) => a.id - b.id);

        items.forEach(function (item) {

                const cartItem =
                    document.createElement(
                        "div"
                    );


                cartItem.className =
                    "cart-item border border-gray-200 bg-white p-5 flex items-center justify-between";


                cartItem.dataset.itemId =
                    item.id;


                cartItem.dataset.price =
                    item.price;


                cartItem.dataset.itemTotal =
                    item.item_total;


                cartItem.innerHTML = `

                    <div class="flex items-center gap-5">

                        <div class="w-24 h-24 bg-gray-100 flex-shrink-0">

                            ${
                                item.image
                                ?

                                `

                                    <img
                                        src="${item.image}"
                                        alt="${item.product}"
                                        class="w-full h-full object-contain"
                                    >

                                `

                                :

                                `

                                    <div class="w-full h-full flex items-center justify-center text-gray-400">
                                        No Image
                                    </div>

                                `
                            }

                        </div>


                        <div>

                            <h3 class="text-lg font-medium">
                                ${item.product}
                            </h3>


                            <p class="text-sm text-gray-500 mt-1">
                                Rs. ${item.price}
                            </p>

                        </div>

                    </div>


                    <div class="flex items-center gap-4">

                        <button
                            type="button"
                            class="decrease border border-gray-300 w-8 h-8"
                        >
                            −
                        </button>


                        <span class="quantity">
                            ${item.quantity}
                        </span>


                        <button
                            type="button"
                            class="increase border border-gray-300 w-8 h-8"
                        >
                            +
                        </button>


                        <span class="text-sm font-medium">
                            Rs. ${item.item_total}
                        </span>


                        <button
                            type="button"
                            class="delete text-gray-500 text-xl"
                        >
                            🗑
                        </button>

                    </div>

                `;


                container.appendChild(
                    cartItem
                );

            }
        );


        document.getElementById(
            "subtotal"
        ).textContent =
            "Rs. " + data.subtotal;


        document.getElementById(
            "total"
        ).textContent =
            "Rs. " + data.subtotal;

    }

    catch (error) {

        console.error(
            "Cart loading error:",
            error
        );


        container.innerHTML = `

            <p class="text-red-500">
                Something went wrong while loading the cart.
            </p>

        `;

    }

}


async function updateQuantity(
    cartItem,
    change
) {

    const itemId =
        cartItem.dataset.itemId;


    const quantityElement =
        cartItem.querySelector(
            ".quantity"
        );


    const currentQuantity =
        parseInt(
            quantityElement.textContent.trim()
        );


    const newQuantity =
        currentQuantity + change;


    if (newQuantity < 1) {

        return;

    }


    try {

        const response =
            await cartRequest(
                "/api/cart/",
                {

                    method: "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        item_id:
                            parseInt(itemId),

                        quantity:
                            newQuantity

                    })

                }
            );


        console.log(
            "Quantity update status:",
            response.status
        );


        const data =
            await response.json();


        console.log(
            "Updated cart:",
            data
        );


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.error ||
                "Unable to update quantity."
            );

            return;

        }


        await loadCart();

    }

    catch (error) {

        console.error(
            "Quantity update error:",
            error
        );

    }

}


async function deleteCartItem(
    cartItem,
    itemId
) {

    const confirmed =
        confirm(
            "Remove this item from your cart?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await cartRequest(
                "/api/cart/",
                {

                    method: "DELETE",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        item_id:
                            parseInt(itemId)

                    })

                }
            );


        console.log(
            "Delete status:",
            response.status
        );


        const data =
            await response.json();


        console.log(
            "Delete response:",
            data
        );


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.error ||
                "Unable to remove item."
            );

            return;

        }


        await loadCart();

    }

    catch (error) {

        console.error(
            "Delete error:",
            error
        );

    }

}


/*
    CART BUTTON HANDLING
*/

const container =
    document.getElementById(
        "api-cart-items"
    );


container.addEventListener(
    "click",
    function(event) {


        /*
            INCREASE
        */

        const increaseButton =
            event.target.closest(
                ".increase"
            );


        if (increaseButton) {

            const cartItem =
                increaseButton.closest(
                    ".cart-item"
                );


            if (cartItem) {

                updateQuantity(
                    cartItem,
                    1
                );

            }


            return;

        }


        /*
            DECREASE
        */

        const decreaseButton =
            event.target.closest(
                ".decrease"
            );


        if (decreaseButton) {

            const cartItem =
                decreaseButton.closest(
                    ".cart-item"
                );


            if (cartItem) {

                updateQuantity(
                    cartItem,
                    -1
                );

            }


            return;

        }


        /*
            DELETE
        */

        const deleteButton =
            event.target.closest(
                ".delete"
            );


        if (deleteButton) {

            const cartItem =
                deleteButton.closest(
                    ".cart-item"
                );


            if (!cartItem) {

                return;

            }


            const itemId =
                cartItem.dataset.itemId;


            deleteCartItem(
                cartItem,
                itemId
            );

        }

    }
);


loadCart();

</script>

{% endblock %}
